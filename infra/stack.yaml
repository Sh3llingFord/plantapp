services:
  plantapp:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # Bestehender cloudflared-Tunnel routet auf 192.168.86.7:9100 (Host-IP:Port),
      # kein gemeinsames Docker-Netz nötig. Ingress-Regel wird außerhalb dieses Repos
      # in der Config des bestehenden Tunnels ergänzt.
      - "9100:3000"
    environment:
      PORT: "3000"
      # Setup-Code für die Selbst-Registrierung (POST /api/auth/register). Ohne
      # gesetzten Wert ist die Registrierung deaktiviert. Frei wählbarer, langer
      # String — separat pro Umgebung setzen, nicht ins Repo.
      PLANTAPP_SETUP_CODE: ${PLANTAPP_SETUP_CODE}
      # M2 — KI-Anreicherung über n8n (siehe infra/n8n-plant-enrich-workflow.json).
      # Beide leer lassen, solange n8n nicht angebunden ist: Enrichment-Jobs
      # bleiben dann einfach "queued", nichts blockiert.
      N8N_ENRICH_WEBHOOK_URL: ${N8N_ENRICH_WEBHOOK_URL}
      # Muss exakt der n8n-Umgebungsvariable PLANTAPP_WEBHOOK_SECRET entsprechen.
      N8N_CALLBACK_SECRET: ${N8N_CALLBACK_SECRET}
      # Öffentliche Basis-URL für die Callback-Adresse. Nötig, weil der Container
      # intern nur HTTP spricht (TLS terminiert am Cloudflare-Tunnel) — ohne das
      # würde die abgeleitete Callback-URL auf http:// statt https:// zeigen.
      PUBLIC_BASE_URL: https://plantsvsmella.inmc.info
    volumes:
      # Host-Pfad aus der Vorbereitung-Checkliste eintragen, siehe docs/ROADMAP.md
      - ${PLANTAPP_DATA_PATH}:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
